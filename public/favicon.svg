<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="poleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#EA580C" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Rich Background Container -->
  <rect width="100" height="100" rx="26" fill="#2A170E"/>

  <!-- Flagpole -->
  <line x1="26" y1="14" x2="26" y2="86" stroke="url(#poleGrad)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="26" cy="14" r="4.5" fill="#FBBF24"/>

  <!-- Waving Orange Flag (Bhagwa Dhwaja) -->
  <path d="M 28 17 Q 52 11 78 20 Q 88 24 92 27 Q 76 35 62 40 Q 78 46 92 53 Q 66 60 28 53 Z" fill="url(#flagGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle flag highlight line -->
  <path d="M 28 23 Q 54 17 76 25" fill="none" stroke="#FFE4D6" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
</svg>
