<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9D00"/>
      <stop offset="45%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="poleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#EA580C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Flagpole -->
  <line x1="20" y1="8" x2="20" y2="92" stroke="url(#poleGrad)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="20" cy="8" r="6" fill="#FBBF24"/>

  <!-- Waving Double-Triangle Orange Flag (Bhagwa Dhwaja) -->
  <path d="M 23 12 Q 55 5 88 15 Q 98 20 100 24 Q 80 34 62 40 Q 82 48 98 55 Q 68 64 23 55 Z" fill="url(#flagGrad)" filter="url(#shadow)"/>
  
  <!-- Flag Highlight contour line -->
  <path d="M 23 20 Q 56 12 85 22" fill="none" stroke="#FFE4D6" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
</svg>
